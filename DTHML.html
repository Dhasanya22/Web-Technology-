<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHTML & DOM Example</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            margin: 50px auto;
            border: 2px solid #333;
            border-radius: 8px;
            text-align: center;
            background-color: #f4f4f4;
            transition: all 0.3s ease;
        }

        .highlight {
            background-color: #e0f7fa;
            border-color: #00796b;
            transform: scale(1.05);
        }

        button {
            padding: 8px 16px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div id="interactiveCard" class="card">
        <h2 id="title">Welcome to DHTML!</h2>
        <p id="description">Click the button below to update this content dynamically using JavaScript.</p>
        <button id="toggleBtn">Update Content</button>
    </div>

    <script>
        // Accessing DOM elements
        const card = document.getElementById('interactiveCard');
        const title = document.getElementById('title');
        const desc = document.getElementById('description');
        const btn = document.getElementById('toggleBtn');

        // Event Handling: Mouseover and Mouseout for CSS Manipulation
        card.addEventListener('mouseover', function() {
            card.classList.add('highlight');
        });

        card.addEventListener('mouseout', function() {
            card.classList.remove('highlight');
        });

        // Event Handling: Onclick for Dynamic Content Modification
        btn.addEventListener('click', function() {
            if (title.innerText === "Welcome to DHTML!") {
                title.innerText = "Content Updated Successfully! 🎉";
                desc.innerText = "DOM Manipulation allows us to change HTML elements, styles, and attributes in real-time.";
                btn.innerText = "Revert Back";
            } else {
                title.innerText = "Welcome to DHTML!";
                desc.innerText = "Click the button below to update this content dynamically using JavaScript.";
                btn.innerText = "Update Content";
            }
        });
    </script>

</body>
</html>
