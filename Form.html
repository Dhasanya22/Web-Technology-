<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
        .form-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; display: none; }
        .active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 0.85em; margin-top: 5px; display: block; }
        button { background-color: #0056b3; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #003d82; }
    </style>
</head>
<body>

    <!-- STEP 1: REGISTER FORM -->
    <div id="step1" class="form-card active">
        <h2>Step 1: Registration</h2>
        <form id="regForm" novalidate>
            <div class="form-group">
                <label for="regUser">Username</label>
                <input type="text" id="regUser">
                <span class="error" id="regUserErr"></span>
            </div>
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail">
                <span class="error" id="regEmailErr"></span>
            </div>
            <div class="form-group">
                <label for="regPass">Password</label>
                <input type="password" id="regPass">
                <span class="error" id="regPassErr"></span>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <!-- STEP 2: LOGIN FORM -->
    <div id="step2" class="form-card">
        <h2>Step 2: Login</h2>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail">
                <span class="error" id="loginEmailErr"></span>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass">
                <span class="error" id="loginPassErr"></span>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- STEP 3: FEEDBACK FORM -->
    <div id="step3" class="form-card">
        <h2>Step 3: Feedback</h2>
        <form id="feedbackForm" novalidate>
            <div class="form-group">
                <label for="fbName">Name</label>
                <input type="text" id="fbName">
                <span class="error" id="fbNameErr"></span>
            </div>
            <div class="form-group">
                <label for="fbRating">Rating</label>
                <select id="fbRating">
                    <option value="">Select Rating</option>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                </select>
                <span class="error" id="fbRatingErr"></span>
            </div>
            <div class="form-group">
                <label for="fbComments">Comments</label>
                <textarea id="fbComments" rows="3"></textarea>
                <span class="error" id="fbCommentsErr"></span>
            </div>
            <button type="submit">Submit Feedback</button>
        </form>
    </div>

    <script>
        // Store registered user details
        let savedUser = { email: '', pass: '' };

        // Helper function to switch steps using DOM loops
        function showStep(stepId) {
            const steps = document.querySelectorAll('.form-card');
            for (let i = 0; i < steps.length; i++) {
                steps[i].classList.remove('active');
            }
            document.getElementById(stepId).classList.add('active');
        }

        // Helper function to clear errors
        function clearErrors(form) {
            const errors = form.querySelectorAll('.error');
            for (let i = 0; i < errors.length; i++) {
                errors[i].innerText = '';
            }
        }

        // 1. REGISTRATION FORM VALIDATION & NAVIGATION
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors(this);
            let isValid = true;

            const user = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;

            // Conditional statement checks
            if (user === '') {
                document.getElementById('regUserErr').innerText = 'Username required';
                isValid = false;
            }

            if (email === '' || !email.includes('@')) {
                document.getElementById('regEmailErr').innerText = 'Valid email required';
                isValid = false;
            }

            // Loop check for at least one numeric digit in password
            let hasDigit = false;
            for (let i = 0; i < pass.length; i++) {
                if (pass[i] >= '0' && pass[i] <= '9') {
                    hasDigit = true;
                    break;
                }
            }

            if (pass.length < 6 || !hasDigit) {
                document.getElementById('regPassErr').innerText = 'Password must be 6+ chars with a number';
                isValid = false;
            }

            if (isValid) {
                savedUser.email = email;
                savedUser.pass = pass;
                alert('Registration successful! Moving to Login.');
                showStep('step2'); // Switch to Step 2
            }
        });

        // 2. LOGIN FORM VALIDATION & NAVIGATION
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors(this);
            let isValid = true;

            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;

            // Conditional statement checks against registered details
            if (email === '' || email !== savedUser.email) {
                document.getElementById('loginEmailErr').innerText = 'Email does not match registered email';
                isValid = false;
            }

            if (pass === '' || pass !== savedUser.pass) {
                document.getElementById('loginPassErr').innerText = 'Incorrect password';
                isValid = false;
            }

            if (isValid) {
                alert('Login successful! Moving to Feedback.');
                document.getElementById('fbName').value = savedUser.email.split('@')[0];
                showStep('step3'); // Switch to Step 3
            }
        });

        // 3. FEEDBACK FORM VALIDATION
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            clearErrors(this);
            let isValid = true;

            const name = document.getElementById('fbName').value.trim();
            const rating = document.getElementById('fbRating').value;
            const comments = document.getElementById('fbComments').value.trim();

            if (name === '') {
                document.getElementById('fbNameErr').innerText = 'Name required';
                isValid = false;
            }

            if (rating === '') {
                document.getElementById('fbRatingErr').innerText = 'Select a rating';
                isValid = false;
            }

            if (comments.length < 10) {
                document.getElementById('fbCommentsErr').innerText = 'Comments must be at least 10 characters';
                isValid = false;
            }

            if (isValid) {
                alert('Thank you! Feedback submitted successfully.');
            }
        });
    </script>
</body>
</html>
